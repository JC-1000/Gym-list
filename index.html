<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym List</title>
<meta name="theme-color" content="#0e1216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym List">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout concept: a plain gym checklist. Week strip sticks to the top; the bottom bar holds the session ring and rest timer. Compact rows: name, muscle tags, weight, set circles with a reps box under each. Flat numbered exercise rows with plate-style set buttons and a rep box under each set. Trend opens a weight-by-week chart with plan, actual and trendline. */
:root {
  --bg: #0e1216; --surface: #161b21; --surface2: #1e252d; --line: #29323c;
  --fg: #eaeef2; --muted: #8b97a4; --faint: #3a4551;
  --accent: #8ec1f0; --accent-ink: #0a1118; --good: #62c490; --good-ink: #0a1a12; --bad: #ef7b76;
  --f-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eff2f5; --surface: #ffffff; --surface2: #e6ebf0; --line: #d1d9e1;
  --fg: #111820; --muted: #566472; --faint: #b9c4cf;
  --accent: #1b69ad; --accent-ink: #ffffff; --good: #1c8553; --good-ink: #ffffff; --bad: #c0392b; color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; padding-inline: 16px; padding-block: 0 110px; background: var(--bg); color: var(--fg); font: 400 16px/1.4 var(--f-body); }
.wrap { max-width: 560px; margin: 0 auto; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 0; }
.hb { display: flex; gap: 8px; }
.app { font: 700 21px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 10px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { min-width: 0; height: 40px; border: 0; border-radius: 10px; background: var(--surface); font: 600 15px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); position: relative; }
.day[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.day.today::after, .day.fin::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.day.fin::after { background: var(--good); }
.day[aria-pressed="true"]::after { background: var(--accent-ink); }

/* bottom bar: session ring + rest timer */
.navrow { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px max(16px, calc((100vw - 560px) / 2)) calc(10px + env(safe-area-inset-bottom, 0px)); }
.navrow .sp { flex: 1; }
.ringp { position: relative; width: 56px; height: 56px; flex: none; }
.ringp svg { width: 100%; height: 100%; display: block; }
.rg { fill: none; stroke: var(--surface2); stroke-width: 9; }
.rf { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .3s; }
.ringp.ok .rf { stroke: var(--good); }
.ringp .ctr { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; line-height: 1; font: 700 19px var(--f-display); font-variant-numeric: tabular-nums; }
.ringp .clock { font: 700 17px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.clk { background: none; border: 0; padding: 0; min-height: 40px; min-width: 66px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 5px; text-align: left; }
.clk .eyebrow { font-size: 11px; letter-spacing: .1em; }
.clk b { font: 700 32px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tbtn { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); font: 600 16px var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.tbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex: 1; min-width: 0; }
.presets .tbtn { padding: 0; }
.auto { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: none; font: 600 14px var(--f-body); color: var(--muted); letter-spacing: .02em; }
.auto[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

.head { padding-block: 6px 14px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font: 600 13px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.head h1 { font: 700 46px/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.head .sub { color: var(--muted); font-size: 16px; }

main { padding-block: 0; display: flex; flex-direction: column; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px 12px; align-items: start; }
.row .ix { grid-column: 1; grid-row: 1; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface2); color: var(--good); font: 700 17px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.row.done .ix { background: var(--good); color: var(--good-ink); }
.row .main { grid-column: 2; grid-row: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.row .nm { font: 600 21px/1.1 var(--f-display); letter-spacing: .005em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.sr { font: 600 16px/1 var(--f-body); font-variant-numeric: tabular-nums; }
.row .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 14px; padding: 4px 10px; border-radius: 8px; background: var(--surface2); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill.m { color: var(--muted); }
.pill svg, .trbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.trbtn svg { color: var(--accent); }
.trbtn { font: 500 14px var(--f-body); min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.wt { grid-column: 3; grid-row: 1; display: flex; align-items: center; gap: 6px; }
.wt input { width: 76px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font: 600 20px var(--f-body); text-align: center; font-variant-numeric: tabular-nums; }
.wt input::placeholder { color: var(--faint); }
.wt span { font: 600 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sets { grid-column: 2 / -1; grid-row: 2; display: flex; gap: 10px; }
.sc { width: 40px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.set { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--good); background: none; font: 700 17px var(--f-display); color: var(--good); padding: 0; }
.set::after { content: ''; position: absolute; inset: -6px -4px -2px; }
.set[aria-pressed="true"] { background: var(--good); color: var(--good-ink); }
.rp { width: 40px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font: 600 16px var(--f-body); text-align: center; font-variant-numeric: tabular-nums; padding: 0; }
.rp::placeholder { color: var(--muted); font-size: 13px; font-weight: 400; }
@media (min-width: 400px) {
  .row .main { grid-row: 1 / 3; }
  .sets { grid-column: 3; grid-row: 2; justify-content: flex-end; }
}
.card { background: var(--surface); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.card h2 { font: 600 24px var(--f-display); }
.card p { color: var(--muted); font-size: 15px; }
.note { color: var(--muted); font-size: 15px; padding: 4px 2px 0; }
.reset { align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: none; font-size: 15px; color: var(--muted); }

/* edit mode */
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.hrow .auto[hidden] { display: none; }
.row.ed { grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; padding: 8px 12px 8px 4px; touch-action: pan-y; }
.row.ed .main { grid-column: 2; grid-row: 1; }
.grip { grid-column: 1; grid-row: 1; width: 44px; height: 56px; display: grid; place-items: center; background: none; border: 0; color: var(--muted); touch-action: none; cursor: grab; }
.grip svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.eb { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; gap: 6px; }
.mini { min-height: 38px; min-width: 76px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: none; font: 600 14px var(--f-body); color: var(--fg); }
.mini.bad { color: var(--bad); }
.row.dragging { position: relative; z-index: 15; border-color: var(--accent); box-shadow: 0 10px 28px rgba(0, 0, 0, .45); background: var(--surface2); }
.addbtn { min-height: 52px; border-radius: 12px; border: 2px dashed var(--accent); background: none; color: var(--accent); font: 700 17px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: 528px; margin-inline: auto; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; }
#toast[hidden] { display: none; }
#toast button { min-height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font: 700 15px var(--f-body); }
#ed, #al { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .66); display: flex; align-items: center; justify-content: center; padding: 16px; }
#ed[hidden], #al[hidden] { display: none; }
.fl { display: flex; flex-direction: column; gap: 6px; font: 600 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; flex: 1; }
.fl input, .fl select { height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--fg); font: 500 16px var(--f-body); padding: 0 12px; letter-spacing: 0; text-transform: none; width: 100%; }
.fr { display: flex; gap: 10px; }
.cancel { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: none; color: var(--muted); font: 600 15px var(--f-body); }
.err { color: var(--bad); font-size: 14px; min-height: 18px; }

/* alert settings */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--muted); font: 600 14px var(--f-body); padding: 0 2px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--surface2); }
.iconbtn { min-width: 44px; padding: 0 !important; display: inline-grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* backup + range chips */
.bk { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.bk label.reset { display: inline-flex; align-items: center; }
.rngs { display: flex; gap: 6px; }
.rgb { flex: 1; min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); font: 600 14px var(--f-body); }
.rgb[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* trend sheet */
#trend { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .66); display: flex; align-items: center; justify-content: center; padding: 16px; }
#trend[hidden] { display: none; }
.tsheet { width: 100%; max-width: 440px; max-height: 90vh; overflow: auto; padding: 20px 18px 18px; gap: 10px; }
.tsheet h2 { font: 700 28px/1.05 var(--f-display); }
.tsheet svg { width: 100%; height: auto; display: block; }
.tsheet .gl { stroke: var(--line); stroke-width: 1; }
.tsheet .ax { fill: var(--muted); font: 500 11px var(--f-body); }
.tsheet .pl { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
.tsheet .tl { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-dasharray: 1 6; stroke-linecap: round; }
.tsheet .ac { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; opacity: .6; }
.tsheet .dt { fill: var(--accent); }
.tsheet .rl { fill: var(--fg); font: 600 11px var(--f-body); }
.leg { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
.leg i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.leg i.d { border-top: 2px dashed var(--muted); }
.leg i.t { border-top: 3px dotted var(--fg); }
.verdict { font-size: 15px; color: var(--fg); }
.verdict b { color: var(--accent); }
.hist { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist div { display: flex; justify-content: space-between; gap: 12px; }
.hist span:last-child { color: var(--fg); text-align: right; }
.tsheet .go { margin-top: 6px; width: 100%; min-height: 48px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font: 700 17px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <div class="hdr"><span class="app">Gym List</span><div class="hb"><button type="button" class="auto iconbtn" id="alertbtn" data-alert-open="1" aria-label="Rest timer alert settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><button type="button" class="auto" id="theme" data-theme-toggle="1"></button><button type="button" class="auto" id="auto" data-auto="1"></button></div></div>
  <div class="top">
    <div class="days" id="days" role="group" aria-label="Day"></div>
  </div>
  <div class="head">
    <div class="hrow"><span class="eyebrow" id="eyebrow"></span><button type="button" class="auto" id="editbtn" data-edit-toggle="1" hidden>Edit</button></div>
    <h1 id="dname"></h1>
    <p class="sub" id="dsub"></p>
  </div>
  <main id="list"></main>
</div>

<div id="toast" hidden><span id="toast-t"></span><button type="button" data-undo="1">Undo</button></div>

<div id="ed" hidden role="dialog" aria-modal="true" aria-labelledby="ed-h">
  <div class="card tsheet">
    <h2 id="ed-h"></h2>
    <label class="fl" id="ed-pickw">Pick one you've used<select id="ed-pick"></select></label>
    <label class="fl">Name<input id="ed-name" type="text" autocomplete="off" maxlength="60"></label>
    <div class="fr"><label class="fl">Sets<input id="ed-sets" type="text" inputmode="numeric" maxlength="2"></label><label class="fl">Reps<input id="ed-reps" type="text" placeholder="8–12" maxlength="14"></label></div>
    <label class="fl">Rest<select id="ed-rest"><option value="150">Heavy · 2–3 min</option><option value="105">Medium · 90–120 sec</option><option value="75">Light · 60–90 sec</option></select></label>
    <label class="fl">Muscles (optional)<input id="ed-mus" type="text" placeholder="Chest, Triceps" maxlength="60"></label>
    <p class="err" id="ed-err"></p>
    <button type="button" class="go" id="ed-save">Save</button>
    <button type="button" class="cancel" id="ed-cancel">Cancel</button>
  </div>
</div>

<div id="al" hidden role="dialog" aria-modal="true" aria-labelledby="al-h">
  <div class="card tsheet">
    <h2 id="al-h">Rest timer alert</h2>
    <div class="seg" id="al-seg">
      <button type="button" data-alert="both">Both</button>
      <button type="button" data-alert="vibrate">Vibrate</button>
      <button type="button" data-alert="sound">Sound</button>
      <button type="button" data-alert="off">Off</button>
    </div>
    <p class="note">Tap an option to try it. Listening to music? Vibrate is usually best, since Sound plays over your music at your media volume. Alerts only fire while the app is open on screen.</p>
    <button type="button" class="go" id="al-close">Done</button>
  </div>
</div>

<div class="navrow" id="navrow"></div>

<div id="trend" hidden role="dialog" aria-modal="true" aria-labelledby="tr-h">
  <div class="card tsheet">
    <span class="eyebrow">Progress</span>
    <h2 id="tr-h"></h2>
    <p class="verdict" id="tr-v"></p>
    <div class="rngs" id="tr-r"></div>
    <div id="tr-c"></div>
    <div class="leg" id="tr-l"></div>
    <div class="hist" id="tr-t"></div>
    <button type="button" class="go" id="tr-go">Close</button>
  </div>
</div>

<script>
(function () {
'use strict';
/* [id, name, sets, reps, rest seconds, rest label] */
var CIRC = 2 * Math.PI * 42;
var R = { H: [150, '2–3 min'], M: [105, '90–120 sec'], L: [75, '60–90 sec'] };
function ex(id, name, sets, reps, r) { return [id, name, sets, reps, R[r][0], R[r][1]]; }
var P = {
  lowInc: ex('inc', 'Low-incline dumbbell press', 3, '6–10', 'H'), pull: ex('pull', 'Overhand lat pulldown', 3, '8–12', 'H'),
  row: ex('row', 'Chest-supported dumbbell row', 3, '8–12', 'H'), lat: ex('lat', 'Lateral raise', 4, '12–20', 'L'),
  scp: ex('scp', 'Single-arm cable chest press / fly', 2, '10–15 / side', 'L'), rear: ex('rear', 'Reverse pec deck / rear-delt fly', 3, '12–20', 'L'),
  push: ex('push', 'Triceps pressdown', 2, '8–15', 'L'), curl: ex('curl', 'Dumbbell / cable curl', 2, '8–15', 'L'),
  legA: ex('legA', 'Squat / hack squat / leg press', 3, '6–10', 'H'), rdl: ex('rdl', 'Romanian deadlift', 3, '6–10', 'H'),
  ext: ex('ext', 'Leg extension', 2, '10–15', 'L'), curlL: ex('lcurlA', 'Leg curl', 3, '8–15', 'L'), calfA: ex('calf', 'Calf raise', 3, '8–15', 'L'),
  crunch: ex('crunch', 'Cable crunch', 3, '10–15', 'L'),
  saPull: ex('sapull', 'Single-arm cable lat pulldown', 3, '10–15 / side', 'L'), flat: ex('flat', 'Flat dumbbell press / chest press', 3, '6–10', 'H'),
  oh: ex('oh', 'Overhead triceps extension', 2, '10–15', 'L'), curlB: ex('curlB', 'Preacher / cable / DB curl', 2, '10–15', 'L'),
  legB: ex('legB', 'Leg press / squat variation', 3, '8–12', 'H'), lcurlB: ex('lcurlB', 'Seated / lying leg curl', 3, '8–12', 'L'),
  bss: ex('bss', 'Bulgarian split squat', 2, '8–12 / leg', 'M'), calfB: ex('calf', 'Calf raise', 3, '10–15', 'L')
};
var MUS = { inc: ['Chest', 'Delts'], pull: ['Lats'], row: ['Upper back', 'Lats'], scp: ['Chest'], lat: ['Side delts'], rear: ['Rear delts'], push: ['Triceps'], curl: ['Biceps'], legA: ['Quads', 'Glutes'], rdl: ['Hamstrings', 'Glutes'], ext: ['Quads'], lcurlA: ['Hamstrings'], calf: ['Calves'], crunch: ['Abs'], sapull: ['Lats'], flat: ['Chest', 'Triceps'], oh: ['Triceps'], curlB: ['Biceps'], legB: ['Quads', 'Glutes'], lcurlB: ['Hamstrings'], bss: ['Quads', 'Glutes'] };
var DAYS = {
  1: { s: 'Mon', n: 'Upper A', m: 'Chest, back, delts + arms', ex: [P.lowInc, P.pull, P.row, P.scp, P.lat, P.rear, P.push, P.curl] },
  2: { s: 'Tue', n: 'Lower A', m: 'Quads, hamstrings, glutes, calves + abs', ex: [P.legA, P.rdl, P.ext, P.curlL, P.calfA, P.crunch] },
  3: { s: 'Wed', n: 'HIIT', m: 'Conditioning', hiit: 1 },
  4: { s: 'Thu', n: 'Upper B', m: 'Back, chest, delts, arms + abs', ex: [P.pull, P.saPull, P.flat, P.row, P.lat, P.rear, P.oh, P.curlB, P.crunch] },
  5: { s: 'Fri', n: 'HIIT', m: 'Conditioning', hiit: 1 },
  6: { s: 'Sat', n: 'Lower B + Delts', m: 'Quads, hamstrings, calves, delts + abs', ex: [P.legB, P.lcurlB, P.bss, P.calfB, P.lat, P.rear, P.crunch] },
  0: { s: 'Sun', n: 'Rest + Walking', m: 'Easy walking', rest: 1 }

function dragMove(e) { if (drag && e.pointerId === drag.pid) { e.preventDefault(); drag.y = e.clientY; dragPlace(); } }
function dragEnd(e) {

  cancelAnimationFrame(drag.raf);
  window.removeEventListener('pointermove', dragMove); window.removeEventListener('pointerup', dragEnd); window.removeEventListener('pointercancel', dragEnd);
  var r = drag.row; r.style.transform = ''; r.classList.remove('dragging'); drag = null;
  var order = Array.prototype.map.call($('#list').querySelectorAll('.row.ed'), function (x) { return +x.dataset.i; });
  var changed = order.some(function (v, i) { return v !== i; });
  if (changed) { var cur = ensurePlan(sel).slice(); S.plan[sel] = order.map(function (i) { return cur[i]; }); save(); }
  render();
}
document.addEventListener('pointerdown', function (e) {
  var g = e.target.closest && e.target.closest('.grip'); if (!g || drag) return;
  var row = g.closest('.row'); e.preventDefault();
  drag = { row: row, pid: e.pointerId, y: e.clientY, grab: e.clientY - row.getBoundingClientRect().top, raf: 0 };
  row.classList.add('dragging');
  try { g.setPointerCapture(e.pointerId); } catch (x) {}
  window.addEventListener('pointermove', dragMove, { passive: false }); window.addEventListener('pointerup', dragEnd); window.addEventListener('pointercancel', dragEnd);
  dragLoop();
});
document.addEventListener('keydown', function (e) {
  var g = e.target.closest && e.target.closest('.grip'); if (!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault(); var i = +g.dataset.grip, to = i + (e.key === 'ArrowUp' ? -1 : 1);
  moveItem(i, to);
  var ng = document.querySelector('[data-grip="' + Math.max(0, Math.min(to, (exs(sel) || []).length - 1)) + '"]'); if (ng) ng.focus();
});

/* ---------- rep log + trend ---------- */
function commit(id) {
  var rs = S.r[key(id)] || [], w = parseFloat(S.w[id]), sets = [];
  rs.forEach(function (v) { var n = parseInt(v, 10); if (n > 0) sets.push([isFinite(w) ? w : 0, n]); });
  if (!S.log[id]) S.log[id] = {};
  if (sets.length) S.log[id][today()] = sets; else delete S.log[id][today()];
  var ds = Object.keys(S.log[id]).sort();
  while (ds.length > 500) delete S.log[id][ds.shift()];
}
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function shortDate(s) { var p = s.split('-'); return MON[+p[1] - 1] + ' ' + (+p[2]); }
/* plan: add weight every WK weeks. Bigger lifts jump more. */
var WK = 3, INC = { inc: 5, flat: 5, pull: 5, row: 5, bss: 5, legA: 10, legB: 10, rdl: 10 };
function stepOf(id) { return INC[id] || 2.5; }
function fmt(v) { return String(Math.round(v * 2) / 2); }
function topSet(sets) { return sets.reduce(function (a, s) { return (s[0] > a[0] || (s[0] === a[0] && s[1] > a[1])) ? s : a; }); }
var trRange = 'all', trId = '', PHASE = 16;
var RANGES = [['16w', 16], ['6m', 26], ['1y', 52], ['all', 0]];
function planAt(x, w0, inc) { return w0 + inc * Math.floor(Math.min(x, PHASE) / WK); }
function chartSvg(pts, x0, x1, w0, inc, tr) {
  var W = 320, H = 200, L = 40, Rr = 12, Tp = 16, B = 26, span = x1 - x0, plan = [], xe = Math.min(x1, PHASE);
  if (xe > x0) {
    plan.push([x0, planAt(x0, w0, inc)]);
    for (var bd = (Math.floor(x0 / WK) + 1) * WK; bd < xe; bd += WK) { plan.push([bd, planAt(bd - 0.001, w0, inc)]); plan.push([bd, planAt(bd, w0, inc)]); }
    plan.push([xe, planAt(xe - 0.001, w0, inc)]);
  }
  var tx0 = pts.length ? Math.max(x0, pts[0].x) : x0;
  var vals = plan.map(function (q) { return q[1]; }).concat(pts.map(function (q) { return q.w; }));
  if (tr) vals.push(tr.a + tr.b * tx0, tr.a + tr.b * x1);
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), pd = (mx - mn) * 0.14 || 2.5;
  mn -= pd; mx += pd;
  var X = function (x) { return L + (x - x0) / span * (W - L - Rr); };
  var Y = function (v) { return Tp + (1 - (v - mn) / (mx - mn)) * (H - Tp - B); };
  var P = function (pp) { return pp.map(function (q, i) { return (i ? 'L' : 'M') + X(q[0]).toFixed(1) + ' ' + Y(q[1]).toFixed(1); }).join(' '); };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Plan versus actual weight by week, with trendline">';
  [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
    var v = mn + (mx - mn) * f, y = Y(v);
    svg += '<line class="gl" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + fmt(v) + '</text>';
  });
  var step = span <= 16 ? 2 : span <= 30 ? 4 : span <= 60 ? 8 : 13;
  for (var x = Math.ceil(x0 / step) * step; x <= x1; x += step) svg += '<text class="ax" x="' + X(x).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + x + '</text>';
  if (plan.length) svg += '<path class="pl" d="' + P(plan) + '"/>';
  if (tr) svg += '<path class="tl" d="' + P([[tx0, tr.a + tr.b * tx0], [x1, tr.a + tr.b * x1]]) + '"/>';
  if (pts.length > 1) svg += '<path class="ac" d="' + P(pts.map(function (q) { return [q.x, q.w]; })) + '"/>';
  var many = pts.length > 30;
  pts.forEach(function (q, i) {
    svg += '<circle class="dt" cx="' + X(q.x).toFixed(1) + '" cy="' + Y(q.w).toFixed(1) + '" r="' + (many ? 3 : 4.5) + '"/>';
    if (pts.length <= 12) svg += '<text class="rl" x="' + X(q.x).toFixed(1) + '" y="' + (Y(q.w) - 8).toFixed(1) + '" text-anchor="middle">×' + q.r + '</text>';
  });
  return svg + '</svg>';
}
function openTrend(id) {
  var e = findEx(id); if (!e) return;
  trId = id;
  var log = S.log[id] || {}, ds = Object.keys(log).sort(), curW = parseFloat(S.w[id]);
  var pts = ds.map(function (d) { var t = topSet(log[d]); return { x: (dnum(d) - dnum(ds[0])) / 7, w: t[0], r: t[1] }; });
  var w0 = pts.length ? pts[0].w : (curW > 0 ? curW : 0), inc = stepOf(id), msg = '', chart = '', rngs = '';
  var plan = 'Plan: +' + inc + ' lb every ' + WK + ' weeks once you own the top of the rep range.';
  $('#tr-h').textContent = e[1];
  if (!(w0 > 0)) {
    msg = 'Enter the weight you are starting with (the box on the exercise) and your reps under each set. The plan and your points show up here.';
  } else {
    var lastX = pts.length ? pts[pts.length - 1].x : 0, rg = RANGES.filter(function (r) { return r[0] === trRange; })[0] || RANGES[3];
    var x1 = Math.max(PHASE, Math.ceil(lastX) + 2), x0 = 0;
    if (rg[1]) { x1 = Math.max(rg[1], Math.ceil(lastX) + 2); x0 = Math.max(0, x1 - rg[1]); }
    var wp = pts.filter(function (q) { return q.x >= x0; }), tr = null, n = pts.length;
    if (wp.length >= 2) {
      var sx = 0, sy = 0, sxy = 0, sxx = 0;
      wp.forEach(function (q) { sx += q.x; sy += q.w; sxy += q.x * q.w; sxx += q.x * q.x; });
      var den = wp.length * sxx - sx * sx;
      if (den > 0) { var b = (wp.length * sxy - sx * sy) / den; tr = { b: b, a: (sy - b * sx) / wp.length }; }
    }
    chart = chartSvg(wp, x0, x1, w0, inc, tr);
    rngs = RANGES.map(function (r) { return '<button type="button" class="rgb" data-rng="' + r[0] + '" aria-pressed="' + (r[0] === trRange) + '">' + (r[0] === 'all' ? 'All' : r[0].toUpperCase()) + '</button>'; }).join('');
    var trTxt = tr ? 'trend ' + (tr.b >= 0 ? '+' : '') + tr.b.toFixed(2) + ' lb/week' : '';
    if (n === 0) msg = 'No sessions logged yet. Starting at ' + fmt(w0) + ' lb. ' + plan;
    else if (n === 1) msg = '<b>First session logged.</b> One more and your trendline appears. ' + plan;
    else {
      var last = pts[n - 1];
      if (last.x > PHASE) msg = '<b>Past the 16-week plan.</b> Latest ' + fmt(last.w) + ' lb' + (trTxt ? ', ' + trTxt + ' over this view' : '') + '. Set the next phase’s plan once this cut ends.';
      else {
        var pw = planAt(last.x, w0, inc), diff = last.w - pw;
        msg = '<b>' + (diff > 0 ? 'Ahead of plan.' : diff === 0 ? 'On plan.' : 'Behind plan.') + '</b> Latest ' + fmt(last.w) + ' lb vs ' + fmt(pw) + ' planned' + (tr ? ', ' + trTxt + ' vs ' + (inc / WK).toFixed(2) + ' planned' : '') + '.' + (diff < 0 ? ' On a cut, holding weight while reps climb is fine.' : '');
      }
    }
  }
  $('#tr-v').innerHTML = msg;
  $('#tr-r').innerHTML = rngs;
  $('#tr-c').innerHTML = chart;
  $('#tr-l').innerHTML = chart ? '<span><i></i>Actual' + (pts.length <= 12 ? ' (×reps)' : '') + '</span>' + (chart.indexOf('class="tl"') > -1 ? '<span><i class="t"></i>Trend</span>' : '') + '<span><i class="d"></i>Plan</span><span>lb by week</span>' : '';
  $('#tr-t').innerHTML = ds.slice(-5).reverse().map(function (d) {
    return '<div><span>' + shortDate(d) + '</span><span>' + log[d].map(function (s) { return (s[0] ? s[0] + '×' : '') + s[1]; }).join(', ') + '</span></div>';
  }).join('');
  $('#trend').hidden = false; if (!$('#tr-r').contains(document.activeElement)) $('#tr-go').focus();
}
$('#tr-go').addEventListener('click', function () { $('#trend').hidden = true; });
$('#trend').addEventListener('click', function (e) { if (e.target === $('#trend')) $('#trend').hidden = true; });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('#trend').hidden = true; $('#al').hidden = true; closeEd(); } });

document.addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  var d = b.dataset;
  if (d.day !== undefined) { sel = +d.day; editing = false; render(); return; }
  if (d.alertOpen) { paintAlert(); $('#al').hidden = false; $('#al-close').focus(); return; }
  if (d.alert) { S.alert = d.alert; save(); paintAlert(); ensureAudio(); beep(S.alert); return; }
  if (d.editToggle) { editing = !editing; render(); return; }
  if (d.editEx !== undefined) { openEd('edit', +d.editEx); return; }
  if (d.addEx) { openEd('add', -1); return; }
  if (d.del !== undefined) { var L0 = exs(sel), nm = L0[+d.del][1]; snapshot(); ensurePlan(sel).splice(+d.del, 1); save(); render(); toast('Removed ' + nm); return; }
  if (d.undo) { if (snap) { if (snap.plan) S.plan[snap.day] = snap.plan; else delete S.plan[snap.day]; snap = null; save(); render(); } $('#toast').hidden = true; return; }
  if (d.resetDay) { if (!armed) { armed = true; b.textContent = 'Tap again to reset this day'; return; } snapshot(); delete S.plan[sel]; save(); render(); toast('Day reset to the original plan'); return; }
  if (d.trend) { openTrend(d.trend); return; }
  if (d.rng) { trRange = d.rng; openTrend(trId); return; }
  if (d.exp) { doExport(); return; }
  if (d.reset) { Object.keys(S.c).forEach(function (k) { delete S.c[k]; }); S.r = {}; Object.keys(S.log).forEach(function (id) { delete S.log[id][today()]; }); if (S.hist[today()] === sel) delete S.hist[today()]; save(); render(); return; }
  if (d.rest) { S.rest = +d.rest; save(); startRest(S.rest, 'Rest'); return; }
  if (d.start) { startRest(S.rest, 'Rest'); return; }
  if (d.tadd) { if (tm.done) startRest(15, 'Rest'); else { tm.end += 15000; tm.total += 15; paintClock(); } return; }
  if (d.tstop) { stopRest(); return; }
  if (d.themeToggle) { S.theme = S.theme === 'light' ? 'dark' : 'light'; save(); paintAuto(); return; }
  if (d.auto) { S.auto = !S.auto; save(); paintAuto(); return; }
  if (d.ex) {
    var k = key(d.ex), i = +d.i, c = S.c[k] || (S.c[k] = []);
    var wasOn = !!c[i], wasComplete = dayComplete(sel);
    c[i] = !wasOn;
    for (var j = 0; j < +d.n; j++) c[j] = !!c[j];
    var isComplete = dayComplete(sel), t = today();
    if (isComplete) S.hist[t] = sel; else if (S.hist[t] === sel) delete S.hist[t];
    save(); render();
    var info = findEx(d.ex);
    if (!wasOn && S.auto && info && d.ex !== 'hiit' && i < info[2] - 1) startRest(info[4], info[1]);
    else if (!wasOn && S.auto && info && d.ex !== 'hiit' && tm.on) stopRest();

});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.w) { S.w[t.dataset.w] = t.value; commit(t.dataset.w); save(); }
  else if (t.dataset && t.dataset.rp) {
    var k = key(t.dataset.rp), a = S.r[k] || (S.r[k] = []);
    a[+t.dataset.i] = t.value.replace(/\D/g, '').slice(0, 3);
    for (var q = 0; q < a.length; q++) a[q] = a[q] || '';
    commit(t.dataset.rp); save();
  }
});

/* ---------- screen wake lock, best effort ---------- */
async function lockOn() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { lockOn(); paintClock(); } });

render(); renderDock(); lockOn();
(async function () {
  try {
    if (!window.claude || !window.claude.use) return;
    var user = await window.claude.use('user'), db = await window.claude.use('db');
    var uid = user ? await user.id() : null;
    if (!db || !uid) return;
    var ref = db.doc('data/users/' + uid + '/gymlist');
    var snap = await ref.get();
    dbDoc = ref;
    if (snap.exists) {
      var r = snap.data() || {};
      if ((r.upd || 0) > S.upd && r.w && r.c) {
        S = JSON.parse(JSON.stringify(r)); fix();
        try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {}
        var a = document.activeElement; if (!(a && a.tagName === 'INPUT')) { render(); if (!tm.on) renderDock(); }

    } else if (S.upd > 0) { dirty = true; flush(); }
  } catch (e) {}

})();
